<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css"><link rel="stylesheet" href="phone.css"><style>
.hero{position:absolute;top:0;left:0;right:0;height:470px;background:linear-gradient(160deg,#FFD6E6 0%,#E6DAFF 100%);border-radius:0 0 48px 48px}
.steps{position:absolute;top:58px;left:28px;display:flex;gap:6px}.steps i{width:22px;height:6px;border-radius:3px;background:rgba(255,255,255,.7)}.steps i.on{width:36px;background:var(--pink-deep)}
.skip{position:absolute;top:52px;right:28px;font-size:14px;color:var(--p-muted)}
.pair{position:absolute;top:110px;left:0;right:0;display:flex;justify-content:center;align-items:center}
.pair .a{width:112px;height:112px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:60px;box-shadow:0 8px 30px rgba(240,106,159,.2)}
.pair .h{width:60px;height:60px;margin:0 -14px;z-index:2;border-radius:50%;background:var(--pink);display:flex;align-items:center;justify-content:center;font-size:30px;border:5px solid #fff}
.ht{position:absolute;top:262px;left:0;right:0;text-align:center}
.ht h1{font-size:30px;font-weight:700}.ht p{margin-top:10px;font-size:15px;color:var(--p-muted);line-height:1.6}
.ht .tag{margin-left:6px}
.mine{position:absolute;top:396px;left:24px;right:24px;padding:22px 24px}
.lbl{font-size:14px;color:var(--p-muted);display:flex;justify-content:space-between}
.lbl b{color:var(--lav-deep);font-weight:500}
.code{margin-top:12px;display:flex;align-items:center;justify-content:space-between}
.code .n{font-size:44px;font-weight:700;letter-spacing:8px;color:var(--p-text);font-variant-numeric:tabular-nums}
.code .acts{display:flex;gap:8px}.code .acts span{padding:8px 14px;border-radius:999px;background:var(--pink-tint);color:var(--pink-deep);font-size:14px;font-weight:700}
.or{position:absolute;top:578px;left:0;right:0;text-align:center;font-size:14px;color:var(--p-muted)}
.or:before,.or:after{content:"";display:inline-block;width:110px;height:1px;background:#EADCE6;vertical-align:middle;margin:0 14px}
.inp{position:absolute;top:620px;left:24px;right:24px;padding:22px 24px}
.boxes{margin-top:14px;display:flex;gap:10px}
.boxes div{flex:1;height:64px;border-radius:16px;background:var(--p-bg);border:2px solid var(--p-line);display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700}
.boxes .f{border-color:var(--lav);background:#fff}.boxes .c{border-color:var(--pink);background:#fff}
.boxes .c:after{content:"";width:2px;height:28px;background:var(--pink-deep)}
.go{position:absolute;left:24px;right:24px;top:806px;height:60px;font-size:18px;box-shadow:0 8px 24px rgba(240,106,159,.35)}
.qr{position:absolute;top:886px;left:0;right:0;text-align:center;font-size:14px;color:var(--lav-deep);font-weight:500}
.foot{position:absolute;left:0;right:0;bottom:44px;text-align:center;font-size:12px;color:var(--p-muted)}.foot a{color:var(--lav-deep)}
.tips{position:absolute;left:24px;right:24px;top:940px;padding:18px 20px;background:var(--lav-tint);border-radius:20px;font-size:13px;line-height:1.75;color:#5E4E78}
.tips b{color:var(--lav-deep)}
</style></head><body><div class="screen">
<div class="hero"></div><div class="sb"><span>23:36</span><span class="r">5G <span class="bat"></span></span></div>
<div class="steps"><i class="on"></i><i></i><i></i></div><div class="skip">1 / 3</div>
<div class="pair"><div class="a"><span class="emoji">🐻</span></div><div class="h"><span class="emoji">💗</span></div><div class="a"><span class="emoji">🐰</span></div></div>
<div class="ht"><h1>和 TA 连上心跳</h1><p>配对后，你们的心情、想念和小短语<br>会实时出现在对方的手环 / 手表上</p></div>
<div class="card mine"><div class="lbl"><span>我的配对码 · 发给 TA</span><b>04:52 后失效</b></div>
<div class="code"><span class="n">382 915</span><span class="acts"><span>复制</span><span>分享</span></span></div></div>
<div class="or">或</div>
<div class="card inp"><div class="lbl"><span>输入 TA 的配对码</span></div>
<div class="boxes"><div class="f">6</div><div class="f">0</div><div class="f">4</div><div class="c"></div><div></div><div></div></div></div>
<div class="btn primary go">开始配对</div>
<div class="qr">扫一扫 TA 的二维码 ›</div>
<div class="tips"><b>小提示</b>　配对码只在 5 分钟内有效。手环上的「心跳」也会显示同一个配对码，两边任选其一输入即可。</div>
<div class="foot">配对即表示同意 <a>用户协议</a> 和 <a>隐私政策</a><br>数据只在你们两人之间同步</div>
</div></body></html>
