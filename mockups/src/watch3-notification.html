<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><link rel="stylesheet" href="tokens.css"><style>
/* Redmi Watch 3: 1.75" AMOLED 390x450. Native system notification UI — we only control title/body text & emoji. */
html,body{width:390px;height:450px;background:#000;overflow:hidden}
.screen{position:relative;width:390px;height:450px;background:#000;color:#fff;border-radius:84px;overflow:hidden}
.clock{position:absolute;top:24px;left:0;right:0;text-align:center;font-size:18px;color:#999;font-weight:500}
.n{position:absolute;left:22px;right:22px;top:58px;height:272px;background:#1C1C1E;border-radius:30px;padding:22px 24px}
.app{display:flex;align-items:center;font-size:16px;color:#AAA}
.app .ic{width:30px;height:30px;border-radius:9px;background:var(--pink);display:flex;align-items:center;justify-content:center;font-size:17px;margin-right:10px}
.app .t{margin-left:auto}
.ti{margin-top:20px;font-size:28px;font-weight:700}
.bd{margin-top:10px;font-size:24px;line-height:1.45;color:#EEE}
.bd .m{display:block;margin-top:8px;font-size:19px;color:#AAA}
.del{position:absolute;left:96px;right:96px;bottom:30px;height:50px;border-radius:999px;background:#2C2C2E;display:flex;align-items:center;justify-content:center;font-size:18px;color:#ddd}
</style></head><body><div class="screen">
<div class="clock">23:36</div>
<div class="n">
<div class="app"><span class="ic emoji">💗</span>心跳 Beat<span class="t">刚刚</span></div>
<div class="ti">💗 老板</div>
<div class="bd">想你了 <span class="emoji">🥰</span><span class="m">心情：<span class="emoji">😪</span> 累了 · 手机上回复</span></div>
</div>
<div class="del">清除</div>
</div></body></html>
